<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline · viewmd</title>
    <style>
      :root { --bg: #ffffff; --ink: #1b1b1f; --muted: #5e5e66; --line: #e6e6e9; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #17171a; --ink: #ececef; --muted: #a4a4ad; --line: #2e2e34; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
        font: 15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { margin: 20px 0 6px; font-size: 22px; letter-spacing: -0.01em; }
      p { margin: 0 auto; max-width: 320px; color: var(--muted); }
      button { margin-top: 24px; height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink);
        color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>viewmd needs a connection to load your notes. It’ll be right here when you’re back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
